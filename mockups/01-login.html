<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to GH-DWD</title>
<link rel="stylesheet" href="_styles.css">
<style>
  body { background: var(--gh-canvas); }
  .login-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  .login-logo svg { width: 48px; height: 48px; fill: var(--gh-fg); }
  .login-heading { font-size: 24px; font-weight: 300; margin: 16px 0 24px; }
  .login-card {
    width: 100%; max-width: 308px;
    background: var(--gh-canvas-overlay);
    border: 1px solid var(--gh-border); border-radius: 6px;
    padding: 16px;
  }
  .login-card label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .login-card .label-row { display: flex; justify-content: space-between; align-items: baseline; }
  .login-card .label-row a { font-size: 12px; }
  .login-card input { margin-bottom: 16px; }
  .login-card .btn-primary { width: 100%; height: 32px; font-size: 14px; }
  .login-extra {
    width: 100%; max-width: 308px;
    margin-top: 16px;
    padding: 16px; text-align: center;
    background: transparent;
    border: 1px solid var(--gh-border); border-radius: 6px;
    font-size: 14px;
  }
</style>
</head>
<body>

<main class="login-page">
  <a class="login-logo" href="#" aria-label="Homepage">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
  </a>
  <h1 class="login-heading">Sign in to GH-DWD</h1>

  <form class="login-card">
    <label for="username">Username</label>
    <input id="username" class="input" type="text" value="halluboys" autocomplete="username">

    <div class="label-row">
      <label for="token">Personal Access Token</label>
      <a href="https://github.com/settings/tokens" target="_blank">Buat token</a>
    </div>
    <input id="token" class="input mono" type="password" value="ghp_xxxxxxxxxxxxxxxxxxxxxx" placeholder="ghp_... atau github_pat_...">

    <button type="button" class="btn btn-primary">Sign in</button>
  </form>

  <div class="login-extra">
    Token butuh scope <code class="mono" style="background:rgba(110,118,129,.4); padding: 1px 4px; border-radius: 3px;">repo</code> untuk akses repo private.
    <div style="margin-top: 8px; color: var(--gh-fg-muted); font-size: 12px;">
      Token disimpan di session server-side, tidak ke browser.
    </div>
  </div>
</main>

<footer class="app-footer">
  <ul style="justify-content: center;">
    <li><a href="#">Terms</a></li>
    <li><a href="#">Privacy</a></li>
    <li><a href="#">Docs</a></li>
    <li><a href="#">Status</a></li>
  </ul>
</footer>

</body>
</html>
