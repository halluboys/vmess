<!-- Shared head + styles, included via JavaScript fetch in mockup pages -->
<style>
  :root {
    --gh-bg:        #0d1117;
    --gh-bg2:       #010409;
    --gh-card:      #161b22;
    --gh-border:    #30363d;
    --gh-fg:        #c9d1d9;
    --gh-fg-muted:  #8b949e;
    --gh-accent:    #58a6ff;
    --gh-success:   #2ea043;
    --gh-danger:    #f85149;
  }
  html, body { background: var(--gh-bg); color: var(--gh-fg); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; margin: 0; }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

  .btn        { display:inline-flex; align-items:center; gap:.4rem; padding:.35rem .75rem; font-size:.8rem; font-weight:500; border-radius:6px; border:1px solid var(--gh-border); background:#21262d; color:var(--gh-fg); transition: all .12s; cursor: pointer; text-decoration:none; }
  .btn:hover  { background:#30363d; border-color:#8b949e; }
  .btn-primary{ background:#238636; border-color:rgba(240,246,252,.1); color:#fff; }
  .btn-primary:hover { background:#2ea043; }
  .pill       { display:inline-flex; align-items:center; padding:.05rem .55rem; font-size:.7rem; font-weight:500; border-radius:999px; border:1px solid var(--gh-border); color:var(--gh-fg-muted); }
  .link       { color: var(--gh-accent); text-decoration:none; }
  .link:hover { text-decoration: underline; }
  .card       { background: var(--gh-card); border:1px solid var(--gh-border); border-radius:6px; }

  .markdown-body { line-height: 1.6; color: var(--gh-fg); font-size: 16px; }
  .markdown-body h1 { font-size: 2em; font-weight: 600; margin: 24px 0 16px; padding-bottom: .3em; border-bottom: 1px solid var(--gh-border); }
  .markdown-body h2 { font-size: 1.5em; font-weight: 600; margin: 24px 0 16px; padding-bottom: .3em; border-bottom: 1px solid var(--gh-border); }
  .markdown-body p { margin: 0 0 16px; }
  .markdown-body ul { list-style: disc; padding-left: 2em; margin: 0 0 16px; }
  .markdown-body code { background: rgba(110,118,129,.4); padding: .2em .4em; border-radius: 6px; font-size: 85%; }
  .markdown-body pre { background: var(--gh-bg2); padding: 16px; border-radius: 6px; overflow-x: auto; margin: 0 0 16px; }
  .markdown-body pre code { background: transparent; padding: 0; font-size: 85%; }
  .markdown-body a { color: var(--gh-accent); }
  .markdown-body a:hover { text-decoration: underline; }

  .file-lineno { display: inline-block; width: 50px; text-align: right; padding-right: 16px; color: var(--gh-fg-muted); user-select: none; }
  .file-line:hover { background: rgba(177,186,196,.06); }

  .diff-add  { background: rgba(46,160,67,.15); }
  .diff-del  { background: rgba(248,81,73,.15); }
  .diff-hunk { background: rgba(56,139,253,.15); color: var(--gh-accent); }

  /* Mockup helpers */
  .mockup-label {
    position: fixed; top: 12px; right: 12px; z-index: 50;
    background: var(--gh-accent); color: #fff;
    padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
</style>
